<h2>観望ガイド</h2>
<div class="label">星図ガイド</div>
<div class="label_s">カシオペヤのＷの高い方の山、中央側の辺の中央あたり。</div>
<div class="fov"><img src="chart.png"></div>
<p>
<div class="label">ファインダーガイド</div>
<div class="label_s">シェダルを中央に入れ、ティエンスーの方へ移動させた途中にある明るい星。<br>（画像の視野は約6度。中央の円は1度と3度の視野角）</div>
<div class="fov"><img src="finder.png"></div>

<h2>観望イメージ（視野は上が北）<h2>
<div class="label_s">光度差があり比較的近いため、やや高倍率で見るのがおすすめ。</div>

<div class="fov"><img src="40.png"></div>
